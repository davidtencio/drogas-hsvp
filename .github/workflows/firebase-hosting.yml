name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Validate Firebase env
        run: |
          missing=0
          for var in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID \
            VITE_FIREBASE_MEASUREMENT_ID; do
            if [ -z "${!var}" ]; then
              echo "Missing $var"
              missing=1
            else
              val="${!var}"
              echo "$var length: ${#val}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Firebase env vars missing. Aborting build."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Las reglas van ANTES que el hosting a proposito. La proteccion del
      # servidor debe estar puesta antes de que salga la interfaz que la asume;
      # al reves quedaria una ventana con la UI nueva y las reglas viejas. El
      # orden inverso es seguro: mientras la coleccion closureLocks este vacia,
      # las reglas nuevas no congelan nada y la interfaz anterior no se entera.
      # Si este paso falla, el hosting no se despliega.
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DROGAS_HSVP }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_DROGAS_HSVP. Aborting deploy."
            exit 1
          fi
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT
          GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE" \
            npx --yes firebase-tools@15 deploy \
              --only firestore:rules \
              --project drogas-hsvp \
              --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DROGAS_HSVP }}
          projectId: drogas-hsvp
          channelId: live
